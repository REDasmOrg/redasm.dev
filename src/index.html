<!doctype html>
<html lang="en">

<head>
    <link rel="icon" type="image/png" href="/favicon-96x96.png?v=20260826" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=20260826" />
    <link rel="shortcut icon" href="/favicon.ico?v=20260826" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=20260826" />
    <meta name="apple-mobile-web-app-title" content="REDasm" />
    <link rel="manifest" href="/site.webmanifest?v=20260826" />
    <link rel="sitemap" type="application/xml" title="Sitemap" href="/sitemap.xml">

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="title" content="REDasm: The Open Source Disassembler">
    <meta name="description"
        content="A cross platform, free and open source disassembler that supports multiple architectures, legacy formats and plugins. No license restrictions">

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://redasm.dev/">
    <meta property="og:title" content="REDasm: The Open Source Disassembler">
    <meta property="og:description"
        content="A cross platform, free and open source disassembler that supports multiple architectures, legacy formats and plugins. No license restrictions">
    <meta property="og:image" content="https://redasm.dev/web_preview.png">

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://redasm.dev/">
    <meta property="twitter:title" content="REDasm: The Open Source Disassembler">
    <meta property="twitter:description"
        content="A cross platform, free and open source disassembler that supports multiple architectures, legacy formats and plugins. No license restrictions">
    <meta property="twitter:image" content="https://redasm.dev/web_preview.png">

    <!-- Mastodon -->
    <link rel="me" href="https://infosec.exchange/@redasm">

    <link rel="stylesheet" href="/app.css">
    <title>REDasm: The Open Source Disassembler</title>

    <script type="application/ld+json">
        {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "REDasm",
        "alternateName": "The Open Source Disassembler",
        "description": "A cross platform, free and open source disassembler that supports multiple architectures, legacy formats and plugins. No license restrictions",
        "url": "https://redasm.dev/",
        "applicationCategory": "DeveloperApplication",
        "operatingSystem": "Windows, Linux",
        "softwareVersion": "4.0.0",
        "license": "https://www.gnu.org/licenses/gpl-3.0.html",
        "isAccessibleForFree": true,
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
        "author": { "@type": "Person", "name": "Antonio Davide", "url": "https://github.com/Dax89" },
        "downloadUrl": "https://github.com/redasm-dev/redasm/releases"
        }
</script>
</head>

<body class="min-h-screen flex flex-col text-foreground bg-background">
    <header class="bg-background-alt text-muted sticky top-0 z-20 px-6 md:px-12 border-b border-background">
        <nav class="flex justify-between h-[48px]">
            <a href="/">
                <img alt="logo" class="h-full py-2" src="/logo.png">
            </a>
            <div class="flex-1"></div>
            <ul class="flex flex-row gap-x-4 my-auto">
                <li>
                    <a data-default target="_blank" class="hover:text-highlight"
                        href="https://github.com/redasm-dev/redasm">
                        <i class="fab fa-github fa-fw fa-lg" aria-label="GitHub"></i>
                    </a>
                </li>
                <li>
                    <a data-default target="_blank" class="hover:text-highlight" href="https://discord.redasm.dev">
                        <i class="fab fa-discord fa-fw fa-lg" aria-label="Discord"></i>
                    </a>
                </li>
                <li>
                    <a data-default target="_blank" class="hover:text-highlight" href="https://www.reddit.com/r/REDasm">
                        <i class="fab fa-reddit fa-fw fa-lg" aria-label="Reddit"></i>
                    </a>
                </li>
                <li>
                    <a data-default target="_blank" class="hover:text-highlight" href="https://x.com/re_dasm">
                        <i class="fab fa-x-twitter fa-fw fa-lg" aria-label="X"></i>
                    </a>
                </li>
                <li>
                    <a data-default target="_blank" class="hover:text-highlight"
                        href="https://infosec.exchange/@redasm">
                        <i class="fab fa-mastodon fa-fw fa-lg" aria-label="Mastodon"></i>
                    </a>
                </li>
                <li>
                    <a data-default target="_blank" class="hover:text-highlight" href="https://www.youtube.com/@redasm">
                        <i class="fab fa-youtube fa-fw fa-lg" aria-label="YouTube"></i>
                    </a>
                </li>
            </ul>
        </nav>
    </header>
    <div class="flex-1">
        <main></main>
    </div>
    <footer class="bg-background-alt text-muted text-xs py-3 px-6 md:px-12">
        <div class="flex flex-col md:flex-row justify-between gap-y-4">
            <section>
                <h2 class="font-bold text-foreground uppercase py-2">License</h2>
                <p class="text-sm">
                    REDasm is Open Source Software and
                    it's released under GNU GPL3 License
                </p>
            </section>
            <section>
                <h2 class="font-bold text-foreground uppercase py-2">Thanks To</h2>
                <ul class="text-sm">
                    <li>
                        <a target="_blank" href="https://www.capstone-engine.org">Capstone Engine</a>
                    </li>
                    <li>
                        <a target="_blank" href="https://zydis.re">Zydis</a>
                    </li>
                </ul>
            </section>
            <section>
                <h2 class="font-bold text-foreground uppercase py-2">Stats</h2>
                <div class="text-foreground">
                    <github-stats></github-stats>
                </div>
            </section>
        </div>
        <div class="flex justify-between text-xs italic pt-3">
            <p>
                Developed with <i class="fas fa-heart text-primary"></i>
                by <a target="_blank" href="https://github.com/Dax89">Dax</a>
            </p>
            <p>
                redasm.dev v2.6.1
            </p>
        </div>
    </footer>
    <script type="module">
        import "$lib/components/ghstats.js";
        import initFontAwesome from "./fontawesome.js";
        import {initApp} from "$app";

        initFontAwesome();
        initApp({
            name: "REDasm",
            description: "The Open Source Disassembler",
        });
    </script>
</body>

</html>
